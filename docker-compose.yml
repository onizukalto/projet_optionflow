services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes:
      - ./models:/app/models:ro

  dashboard:
    build: .
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    ports: ["8501:8501"]
    volumes:
      - ./models:/app/models:ro
      - ./data/processed:/app/data/processed:ro
